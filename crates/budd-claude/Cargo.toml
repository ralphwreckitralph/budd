[package]
name = "budd-claude"
description = "Adapters around the user's Claude Code CLI: processes, pty, state files, compat parsers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
budd-core = { path = "../budd-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2"
tempfile = "3"
semver = "1"
which = "7"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "process", "fs", "sync", "macros"] }
portable-pty = "0.9"
vt100 = "0.16"
notify = "8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_Storage_FileSystem",
    "Win32_System_SystemServices", "Win32_System_ProcessStatus", "Win32_System_IO", "Win32_System_Registry",
] }

[dev-dependencies]
tempfile = "3"
