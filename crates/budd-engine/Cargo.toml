[package]
name = "budd-engine"
description = "The running state machine: sessions, crew, asks, autopilot, scheduler, IPC server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
budd-core = { path = "../budd-core" }
budd-proto = { path = "../budd-proto" }
budd-claude = { path = "../budd-claude" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "process", "fs", "sync", "macros"] }

[dev-dependencies]
tempfile = "3"
