[package]
name = "budd-app"
description = "Budd's office: the desktop shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "budd_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["macos-private-api"] }
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-opener = "2.7.2"
tauri-plugin-log = "2.10.1"
log = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = ["NSPanel", "NSWindow", "NSResponder", "NSGraphics", "NSView", "NSEvent", "block2"] }
objc2-foundation = { version = "0.3.2", features = ["NSGeometry"] }
block2 = "0.6.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[lints.clippy]
all = "warn"
