[workspace]
resolver = "2"
members = ["crates/*", "xtask", "app/src-tauri"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/ralphwreckitralph/budd"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
